name: TestFlight

# Builds, signs and uploads the app to App Store Connect / TestFlight.
# Run it from the Actions tab ("Run workflow").
# It also runs monthly so TestFlight builds never reach their 90-day expiry.
#
# Configuration (see docs/maintainers.md):
#   Repository variables: APP_BUNDLE_ID, APPLE_TEAM_ID (optional: APP_DISPLAY_NAME,
#                         and the secret PRO_OWNERS = iCloud IDs that always get Pro,
#                         CLOUDKIT_CONTAINER, ICLOUD_SYNC=off to build without iCloud)
#   Repository secrets:   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# iCloud sync needs the CloudKit container described in docs/maintainers.md.

on:
  workflow_dispatch:
    inputs:
      testers_get_pro:
        description: "Give every tester Pro (leave unticked: only the owners in PRO_OWNERS get Pro)"
        type: boolean
        default: false
      for_app_review:
        description: "Build to submit to the App Store (lets App Review make a test purchase)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 1 * *"

concurrency:
  group: testflight
  cancel-in-progress: false

# The workflow token can only read the code.
permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME || 'Quire' }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CLOUDKIT_CONTAINER: ${{ vars.CLOUDKIT_CONTAINER || format('iCloud.{0}', vars.APP_BUNDLE_ID) }}
      ICLOUD_SYNC: ${{ vars.ICLOUD_SYNC || 'on' }}
      # A secret, so the IDs never appear in the (public) logs.
      PRO_OWNERS: ${{ secrets.PRO_OWNERS || vars.PRO_OWNERS }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$APP_BUNDLE_ID" ] || missing="$missing APP_BUNDLE_ID(variable)"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variable)"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID(secret)"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID(secret)"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not set up yet. Missing:$missing. See docs/maintainers.md."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          # Scheduled runs have no inputs: testers don't get Pro.
          if [ "${{ inputs.testers_get_pro }}" = "true" ]; then
            echo "PRO_FLAG=TESTFLIGHT_PRO" >> "$GITHUB_ENV"
            echo "Building with Pro unlocked for every tester."
          else
            echo "PRO_FLAG=" >> "$GITHUB_ENV"
            if [ -n "$PRO_OWNERS" ]; then echo "Pro only for the owners in PRO_OWNERS."; else echo "::warning::PRO_OWNERS isn't set, so nobody has Pro in this build."; fi
          fi
          if [ "${{ inputs.for_app_review }}" = "true" ]; then
            echo "BLOCK_TEST_PURCHASES=NO" >> "$GITHUB_ENV"
            echo "App Store submission build: test purchases allowed for App Review."
          else
            echo "BLOCK_TEST_PURCHASES=YES" >> "$GITHUB_ENV"
            echo "Testers can't buy Pro (test purchases blocked)."
          fi
          if [ "$ICLOUD_SYNC" = "off" ]; then
            echo "CLOUD_SYNC=NO" >> "$GITHUB_ENV"
            echo "iCloud sync: off (ICLOUD_SYNC variable)."
          else
            echo "CLOUD_SYNC=YES" >> "$GITHUB_ENV"
            echo "iCloud sync: on, container $CLOUDKIT_CONTAINER."
          fi

      # Archive unsigned: an automatic-signing archive would need a development
      # profile, which requires registered devices. The export step below signs
      # the app once, for App Store distribution, using cloud-managed signing.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MusicLibrary.xcodeproj \
            -scheme MusicLibrary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MusicLibrary.xcarchive" \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            APP_DISPLAY_NAME="$APP_DISPLAY_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$PRO_FLAG" \
            CLOUD_SYNC="$CLOUD_SYNC" \
            CLOUDKIT_CONTAINER_ID="$CLOUDKIT_CONTAINER" \
            PRO_OWNERS="$PRO_OWNERS" \
            BLOCK_TEST_PURCHASES="$BLOCK_TEST_PURCHASES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet 2>&1 | tee archive.log

      # The archive is unsigned, so it carries no entitlements, and the export
      # step takes the app's entitlements from its existing signature. Give it a
      # throwaway (ad hoc) signature with the iCloud entitlements; the export then
      # re-signs it for distribution with a profile that includes iCloud.
      - name: Add iCloud entitlements
        if: env.CLOUD_SYNC == 'YES'
        run: |
          APP=$(ls -d "$RUNNER_TEMP/MusicLibrary.xcarchive/Products/Applications/"*.app | head -1)
          cat > "$RUNNER_TEMP/iCloud.entitlements" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key><string>production</string>
            <key>com.apple.developer.icloud-container-environment</key><string>Production</string>
            <key>com.apple.developer.icloud-container-identifiers</key>
            <array><string>$CLOUDKIT_CONTAINER</string></array>
            <key>com.apple.developer.icloud-services</key>
            <array><string>CloudKit</string></array>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - --timestamp=none \
            --entitlements "$RUNNER_TEMP/iCloud.entitlements" "$APP"
          codesign -d --entitlements - "$APP"

      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          # First export to a folder and check the signed app really has iCloud,
          # so a build without sync is never uploaded by mistake.
          if [ "$CLOUD_SYNC" = "YES" ]; then
            sed 's#<string>upload</string>#<string>export</string>#' \
              "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/ExportCheck.plist"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/MusicLibrary.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportCheck.plist" \
              -exportPath "$RUNNER_TEMP/check" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              2>&1 | tee export-check.log
            mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$RUNNER_TEMP/check/"*.ipa -d "$RUNNER_TEMP/ipa"
            SIGNED=$(ls -d "$RUNNER_TEMP/ipa/Payload/"*.app | head -1)
            codesign -d --entitlements - --xml "$SIGNED" > "$RUNNER_TEMP/signed.plist" 2>/dev/null \
              || codesign -d --entitlements :- "$SIGNED" > "$RUNNER_TEMP/signed.plist"
            if ! grep -q "$CLOUDKIT_CONTAINER" "$RUNNER_TEMP/signed.plist"; then
              echo "::error::The signed app has no iCloud entitlement. Check the iCloud capability and container on your App ID (docs/maintainers.md), or set the ICLOUD_SYNC variable to off."
              cat "$RUNNER_TEMP/signed.plist"
              exit 1
            fi
            echo "iCloud entitlements present for $CLOUDKIT_CONTAINER."
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MusicLibrary.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple's processing (usually 5–15 minutes)."

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: "*.log"
          retention-days: 7
