# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: MusicLibrary
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MusicLibrary:
    type: application
    platform: iOS
    sources:
      - path: MusicLibrary.swiftpm/Sources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_NAME: MusicLibrary
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/MusicLibrary-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # iCloud sync and the Choir Library (see docs/icloud-and-choir-plan.md).
        # CLOUD_SYNC is YES only in signed TestFlight/App Store builds, which have
        # the iCloud entitlements; other builds keep everything on the device.
        QuireCloudSync: $(CLOUD_SYNC)
        QuireCloudKitContainer: $(CLOUDKIT_CONTAINER_ID)
        # iCloud IDs (comma-separated) that always have Pro: the app's owners.
        QuireProOwners: $(PRO_OWNERS)
        # YES: test purchases are blocked in TestFlight (testers can't get Pro free).
        QuireBlockTestPurchases: $(BLOCK_TEST_PURCHASES)
        CKSharingSupported: true
        UIBackgroundModes:
          - remote-notification
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 Alex Hall. All rights reserved."
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Library Metadata
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
  MusicLibraryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusicLibraryTests
    dependencies:
      - target: MusicLibrary
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
schemes:
  MusicLibrary:
    build:
      targets:
        MusicLibrary: all
        MusicLibraryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusicLibraryTests
    archive:
      config: Release
